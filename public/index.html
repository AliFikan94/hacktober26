<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeachBack</title>
<style>
  :root { --bg:#0f1420; --panel:#181f30; --ink:#e8ecf5; --mute:#8d97b0; --acc:#ffb703; --ok:#3ddc97; --line:#8d97b033; --code:#0b0f19; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6fa; --panel:#fff; --ink:#1b2133; --mute:#5b6580; --code:#f0f2f8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,sans-serif; }
  header { padding:14px 16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; justify-content:space-between; }
  h1 { margin:0; font-size:1.3rem; } h2 { margin:0 0 4px; font-size:1.25rem; } h3 { font-size:1rem; margin:16px 0 6px; }
  .tag { color:var(--mute); font-size:.85rem; }
  .layout { display:grid; grid-template-columns: 290px 1fr; gap:16px; padding:0 16px 24px; align-items:start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border-radius:12px; padding:14px; }
  /* syllabus */
  .course { font-weight:700; } .sub { color:var(--mute); font-size:.8rem; margin-bottom:8px; }
  .overall { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .overall i { display:block; height:100%; background:var(--ok); transition:width .3s; }
  .mod { margin-top:12px; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .lesson { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; background:transparent; color:var(--ink);
    border:1px solid transparent; border-radius:8px; padding:8px; margin-top:4px; cursor:pointer; font:inherit; }
  .lesson:hover { border-color:var(--line); } .lesson.active { background:#ffb70322; border-color:var(--acc); }
  .dots { display:flex; gap:3px; flex:none; } .dots i { width:8px; height:8px; border-radius:50%; background:var(--line); } .dots i.on { background:var(--ok); }
  /* tabs */
  .tabs { display:flex; gap:4px; flex-wrap:wrap; margin:12px 0; border-bottom:1px solid var(--line); }
  .tab { background:transparent; color:var(--mute); border:0; border-bottom:3px solid transparent; padding:8px 12px; cursor:pointer; font:inherit; font-weight:600; }
  .tab.active { color:var(--ink); border-color:var(--acc); } .tab.done::after { content:" ✓"; color:var(--ok); }
  /* forms */
  label { display:block; font-size:.8rem; color:var(--mute); margin:10px 0 4px; }
  input, textarea { width:100%; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  textarea.code, pre.out, pre.ex { font-family: ui-monospace, Consolas, monospace; font-size:.88rem; }
  textarea.code { height:220px; background:var(--code); tab-size:4; }
  pre.out, pre.ex { background:var(--code); border-radius:8px; padding:10px; margin:8px 0 0; min-height:2.5em; white-space:pre-wrap; overflow:auto; }
  pre.out.err { color:#ff6b81; }
  textarea.say { height:80px; }
  code { background:var(--code); padding:1px 5px; border-radius:4px; }
  button.btn { background:var(--acc); color:#111; border:0; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
  button.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.btn.rec { background:#ff4d6d; color:#fff; } button.btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .box { border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:8px; }
  .hit a { color:var(--acc); font-weight:600; text-decoration:none; word-break:break-word; } .hit p { margin:2px 0 0; color:var(--mute); font-size:.85rem; }
  .hit { margin:10px 0; } .note { color:var(--mute); font-size:.85rem; }
  /* classroom */
  .student { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); } .student:last-child { border:0; }
  .face { font-size:2rem; } .name { font-weight:700; } .role { color:var(--mute); font-size:.8rem; } .q { margin:4px 0; min-height:1.5em; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--ok); width:0; transition:width .4s; }
  #status { color:var(--mute); font-size:.85rem; min-height:1.3em; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>🎓 TeachBack</h1>
  <span class="tag">Theory → Practice → Workshop → <b>Teach</b> · <span id="model"></span></span>
</header>
<div class="layout">
  <aside class="panel" id="syllabus">Loading syllabus…</aside>
  <main class="panel" id="lesson"></main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const PHASES = ["theory", "practice", "workshop", "teach"];
const PHASE_LABEL = { theory: "📖 Theory", practice: "✏️ Practice", workshop: "🛠️ Workshop", teach: "🎓 Teach" };

let cfg, course, lessons = [], current, phase = "theory", muted = false;
let progress = store.get("tb-progress", {});
const baseSession = store.get("tb-session", null) || (crypto.randomUUID?.() ?? String(Date.now()));
store.set("tb-session", baseSession);

const isDone = (lid, p) => !!progress[lid]?.[p];
function markDone(lid, p) { (progress[lid] ??= {})[p] = true; store.set("tb-progress", progress); renderSyllabus(); renderTabs(); }

async function init() {
  [cfg, course] = await Promise.all([fetch("/api/config").then((r) => r.json()), fetch("/api/curriculum").then((r) => r.json())]);
  $("model").textContent = "running " + cfg.model + (cfg.elevenlabs ? " · ElevenLabs voices" : " · browser voices");
  lessons = course.modules.flatMap((m) => m.lessons);
  const last = store.get("tb-last", lessons[0].id);
  select(lessons.find((l) => l.id === last) ?? lessons[0]);
}

function renderSyllabus() {
  const total = lessons.length * 4, done = lessons.reduce((n, l) => n + PHASES.filter((p) => isDone(l.id, p)).length, 0);
  $("syllabus").innerHTML = `<div class="course">${esc(course.title)}</div><div class="sub">${esc(course.subtitle)}</div>
    <div class="overall"><i style="width:${(done / total) * 100}%"></i></div><div class="note">${done} of ${total} steps complete</div>` +
    course.modules.map((m) => `<div class="mod">${esc(m.title)}</div>` + m.lessons.map((l) =>
      `<button class="lesson ${l.id === current?.id ? "active" : ""}" data-id="${l.id}"><span>${esc(l.title)}</span>
        <span class="dots">${PHASES.map((p) => `<i class="${isDone(l.id, p) ? "on" : ""}"></i>`).join("")}</span></button>`).join("")).join("");
  document.querySelectorAll(".lesson").forEach((b) => (b.onclick = () => select(lessons.find((l) => l.id === b.dataset.id))));
}

function select(l) {
  current = l; store.set("tb-last", l.id);
  const firstTodo = PHASES.find((p) => !isDone(l.id, p)) ?? "theory";
  $("lesson").innerHTML = `<h2>${esc(l.title)}</h2><div class="tabs" id="tabs"></div><div id="body"></div>`;
  renderSyllabus(); showPhase(firstTodo);
}
function renderTabs() {
  if (!$("tabs")) return;
  $("tabs").innerHTML = PHASES.map((p) => `<button class="tab ${p === phase ? "active" : ""} ${isDone(current.id, p) ? "done" : ""}" data-p="${p}">${PHASE_LABEL[p]}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => (b.onclick = () => showPhase(b.dataset.p)));
}
function showPhase(p) {
  phase = p; renderTabs(); speechSynthesis.cancel();
  ({ theory: viewTheory, practice: () => viewEditor("practice"), workshop: () => viewEditor("workshop"), teach: viewTeach })[p]();
}
const completeBtn = (p, label) => `<button class="btn ${isDone(current.id, p) ? "ghost" : ""}" id="complete">${isDone(current.id, p) ? "✓ Completed" : label}</button>`;
function wireComplete(p, next) { $("complete").onclick = () => { markDone(current.id, p); if (next) showPhase(next); }; }

/* ---------- Theory ---------- */
function viewTheory() {
  const l = current;
  $("body").innerHTML = `${l.theory}
    <h3>Example</h3><pre class="ex">${esc(l.example)}</pre>
    <div class="row"><button class="btn ghost" id="tryit">▶ Try it in the editor</button></div>
    <h3>Learning resources</h3>
    ${l.links.map((k) => `<div class="hit"><a href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.title)}</a></div>`).join("")}
    <label for="q">Search the web (DuckDuckGo, no account needed)</label>
    <div class="row" style="margin-top:0"><input id="q" value="${esc(l.search)}" style="flex:1;min-width:200px"><button class="btn ghost" id="go">Search</button></div>
    <div id="hits"></div>
    <div class="row">${completeBtn("theory", "✓ Mark as read → Practice")}</div>`;
  wireComplete("theory", "practice");
  $("tryit").onclick = () => { store.set(`tb-code-${l.id}-practice`, l.example); showPhase("practice"); };
  const search = async () => {
    $("hits").innerHTML = `<p class="note">Searching…</p>`;
    try {
      const r = await fetch("/api/search?q=" + encodeURIComponent($("q").value)); const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      $("hits").innerHTML = d.hits.length ? d.hits.map((h) => `<div class="hit"><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a><p>${esc(h.snippet)}</p></div>`).join("")
        : `<p class="note">No results.</p>`;
    } catch (e) { $("hits").innerHTML = `<p class="note">${esc(e.message)}. The links above still work.</p>`; }
  };
  $("go").onclick = search; $("q").onkeydown = (e) => e.key === "Enter" && search();
}

/* ---------- Practice / Workshop (in-browser Python via Pyodide) ---------- */
let pyPromise;
function getPython() {
  return (pyPromise ??= new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
    s.onload = () => loadPyodide().then(ok, fail); s.onerror = () => fail(new Error("Could not load the Python runtime (needs internet once)."));
    document.head.appendChild(s);
  }).catch((e) => { pyPromise = null; throw e; }));
}
function viewEditor(kind) {
  const l = current, t = l[kind], key = `tb-code-${l.id}-${kind}`;
  $("body").innerHTML = `<p>${kind === "workshop" ? `<b>${esc(t.title)}.</b> ` : ""}${esc(t.prompt ?? t.brief)}</p>
    <label for="ed">Your code</label><textarea id="ed" class="code" spellcheck="false"></textarea>
    <div class="row"><button class="btn" id="run">▶ Run</button><button class="btn ghost" id="reset">Reset</button>${completeBtn(kind, kind === "practice" ? "✓ Done → Workshop" : "✓ Done → Teach")}</div>
    <pre class="out" id="out">Output appears here.</pre>
    <p class="note">Runs in your browser (Pyodide). Be careful with infinite loops: they will freeze this tab.</p>`;
  const ed = $("ed"); ed.value = store.get(key, t.starter);
  ed.oninput = () => store.set(key, ed.value);
  ed.onkeydown = (e) => { if (e.key === "Tab") { e.preventDefault(); const s = ed.selectionStart; ed.setRangeText("    ", s, ed.selectionEnd, "end"); ed.oninput(); } };
  $("reset").onclick = () => { ed.value = t.starter; ed.oninput(); };
  wireComplete(kind, kind === "practice" ? "workshop" : "teach");
  $("run").onclick = async () => {
    const out = $("out"); out.className = "out"; out.textContent = "Running…"; $("run").disabled = true;
    try {
      const py = await getPython(); let buf = "";
      py.setStdout({ batched: (s) => (buf += s + "\n") }); py.setStderr({ batched: (s) => (buf += s + "\n") });
      try { await py.runPythonAsync(ed.value); out.textContent = buf || "(ran with no output)"; }
      catch (e) { out.className = "out err"; out.textContent = buf + String(e.message).split("\n").slice(-6).join("\n"); }
    } catch (e) { out.className = "out err"; out.textContent = e.message; }
    $("run").disabled = false;
  };
}

/* ---------- Teach: three AI students ---------- */
const voices = { maya: { pitch: 1.2, rate: 1.05 }, kofi: { pitch: 0.7, rate: 0.95 }, zee: { pitch: 1.5, rate: 0.9 } };
let queue = Promise.resolve();
function speak(id, text) {
  queue = queue.then(async () => {
    if (muted) return;
    if (cfg.elevenlabs) {
      const r = await fetch("/api/tts", { method: "POST", body: JSON.stringify({ student: id, text }) });
      if (r.ok) { const a = new Audio(URL.createObjectURL(await r.blob())); return new Promise((ok) => { a.onended = ok; a.onerror = ok; a.play().catch(ok); }); }
    }
    return new Promise((ok) => { const u = new SpeechSynthesisUtterance(text); Object.assign(u, voices[id]); u.onend = ok; u.onerror = ok; speechSynthesis.speak(u); });
  });
}
function viewTeach() {
  const l = current, codeKey = `tb-code-${l.id}-teach`;
  $("body").innerHTML = `<p>Now teach it back. Explain the code below <b>out loud</b> to three AI students. You've made it when all three understand (7+/10).</p>
    <label for="topic">Topic you're teaching</label><input id="topic" value="${esc(l.teach.topic)}">
    <label for="code">Shared screen</label><textarea id="code" class="code" spellcheck="false" style="height:170px"></textarea>
    <div class="row"><button class="btn ghost" id="mine">Use my workshop code</button></div>
    <label for="say">Explain it (speak or type)</label><textarea id="say" class="say" placeholder="This function takes … then …"></textarea>
    <div class="row"><button id="mic" class="btn ghost">🎙️ Hold to talk</button><button id="send" class="btn">Teach →</button><button id="stop" class="btn ghost">${muted ? "🔊 Unmute" : "🔇 Mute"}</button></div>
    <div id="status"></div>
    <div id="students">${Object.entries(cfg.students).map(([id, s]) => `<div class="student" id="s-${id}"><div class="face">${s.emoji}</div><div style="flex:1">
      <div class="name">${s.name} <span class="role">${s.role}</span></div><div class="q">Waiting for you to teach…</div><div class="bar"><i></i></div></div></div>`).join("")}</div>`;
  $("code").value = store.get(codeKey, l.example); $("code").oninput = () => store.set(codeKey, $("code").value);
  $("mine").onclick = () => { $("code").value = store.get(`tb-code-${l.id}-workshop`, store.get(`tb-code-${l.id}-practice`, l.example)); $("code").oninput(); };
  $("stop").onclick = () => { muted = !muted; speechSynthesis.cancel(); $("stop").textContent = muted ? "🔊 Unmute" : "🔇 Mute"; };
  $("send").onclick = teach;
  initMic();
}
async function teach() {
  const utterance = $("say").value.trim(); if (!utterance) return;
  const lid = current.id;
  $("status").textContent = "Students are thinking…"; $("send").disabled = true;
  try {
    const r = await fetch("/api/turn", { method: "POST", body: JSON.stringify({
      sessionId: `${baseSession}:${lid}`, topic: $("topic").value, code: $("code").value, utterance }) });
    const data = await r.json(); if (!r.ok) throw new Error(data.error);
    if (current.id !== lid || phase !== "teach") return;
    for (const rep of data.replies) {
      const el = $("s-" + rep.id);
      el.querySelector(".q").textContent = rep.question; el.querySelector(".bar i").style.width = rep.understanding * 10 + "%"; speak(rep.id, rep.question);
    }
    $("say").value = "";
    if (data.replies.every((x) => x.understanding >= 7)) { markDone(lid, "teach"); $("status").textContent = "🎉 All three understood. Lesson complete!"; }
    else $("status").textContent = "Answer them. What would you say?";
  } catch (e) { $("status").textContent = "Error: " + e.message + " (Check: Ollama running? Model name right? Header shows the model in use.)"; }
  $("send").disabled = false;
}
function initMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $("mic");
  if (!SR) { mic.disabled = true; mic.title = "Speech recognition not supported in this browser (use Chrome/Edge/Safari)"; return; }
  const rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = "en-US"; let base = "";
  rec.onresult = (e) => { $("say").value = base + [...e.results].map((r) => r[0].transcript).join(" "); };
  rec.onend = () => mic.classList.remove("rec");
  mic.addEventListener("pointerdown", () => { speechSynthesis.cancel(); base = $("say").value ? $("say").value + " " : ""; mic.classList.add("rec"); try { rec.start(); } catch {} });
  mic.addEventListener("pointerup", () => { rec.stop(); setTimeout(() => $("say").value.trim() && teach(), 600); });
}
init();
</script>
</body>
</html>
